services:

  vivo-solr:
    container_name: vivo-solr
    image: vivoweb/vivo-solr:latest
    hostname: vivo-solr
    environment:
      - RESET_CORE=${SOLR_RESET_CORE}
      - VERBOSE=${SOLR_VERBOSE}
    ports:
      - ${SOLR_HOST_PORT}:${SOLR_CONTAINER_PORT}
    volumes:
      - ${SOLR_CORES}:/opt/solr/server/solr/vivocore
    networks:
      - vivoweb
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${SOLR_CONTAINER_PORT}/solr/vivocore/admin/ping || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3

  vivo:
    container_name: vivo
    image: gaziyucel/vivo:i4018
    hostname: vivo
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        - VIVO_TDB_FILE_MODE=${VIVO_TDB_FILE_MODE:-direct}
        - VIVO_CONTAINER_VIVO_HOME=${VIVO_CONTAINER_VIVO_HOME:-/usr/local/vivo/home}
    env_file:
      - .env
    ports:
      - ${VIVO_HOST_PORT}:${VIVO_CONTAINER_PORT}
    volumes:
      - ${VIVO_HOST_VIVO_HOME}:${VIVO_CONTAINER_VIVO_HOME}
    networks:
      - vivoweb
    depends_on:
      vivo-solr:
        condition: service_healthy

networks:
  vivoweb:
