version: '3.2'

services:

  vivo-solr:
    container_name: vivo-solr
    image: vivoweb/vivo-solr:latest
    environment:
      - SOLR_RESET_CORE=${SOLR_RESET_CORE}
      - VERBOSE=${SOLR_VERBOSE}
    ports:
      - ${SOLR_HOST_PORT}:${SOLR_CONTAINER_PORT}
    volumes:
      - ${SOLR_CORES}:/opt/solr/server/solr/mycores
    networks:
      - vivoweb
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8983/solr/vivocore/admin/ping || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3

  vivo:
    container_name: vivo
    image: vivoweb/vivo:latest
    hostname: vivo
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        - DEFAULT_NAMESPACE=${DEFAULT_NAMESPACE}
        - EMAIL_PASSWORD=${EMAIL_PASSWORD}
        - EMAIL_PORT=${EMAIL_PORT}
        - EMAIL_REPLY_TO=${EMAIL_REPLY_TO}
        - EMAIL_SMTP_HOST=${EMAIL_SMTP_HOST}
        - EMAIL_USERNAME=${EMAIL_USERNAME}
        - FORCE_LOCALE=${FORCE_LOCALE}
        - LANGUAGE_FILTER_ENABLED=${LANGUAGE_FILTER_ENABLED}
        - RECONFIGURE=${RECONFIGURE}
        - ROOT_USER_ADDRESS=${ROOT_USER_ADDRESS}
        - SAMPLE_DATA_BRANCH=${SAMPLE_DATA_BRANCH}
        - SAMPLE_DATA_DIRECTORY=${SAMPLE_DATA_DIRECTORY}
        - SAMPLE_DATA_LOAD=${SAMPLE_DATA_LOAD}
        - SAMPLE_DATA_REPO_URL=${SAMPLE_DATA_REPO_URL}
        - SEARCH_ENGINE_PASSWORD=${SEARCH_ENGINE_PASSWORD}
        - SEARCH_ENGINE_URL=${SEARCH_ENGINE_URL}
        - SEARCH_ENGINE_USERNAME=${SEARCH_ENGINE_USERNAME}
        - SELECTABLE_LOCALES=${SELECTABLE_LOCALES}
        - SELF_ID_MATCHING_PROPERTY=${SELF_ID_MATCHING_PROPERTY}
        - SOLR_CONTAINER_PORT=${SOLR_CONTAINER_PORT}
        - SOLR_CORES=${SOLR_CORES}
        - SOLR_HOST_PORT=${SOLR_HOST_PORT}
        - SOLR_RESET_CORE=${SOLR_RESET_CORE}
        - SOLR_URL=${SOLR_URL}
        - SOLR_VERBOSE=${SOLR_VERBOSE}
        - TOMCAT_CONTEXT_PATH=${TOMCAT_CONTEXT_PATH}
        - VIVO_CONTAINER_PORT=${VIVO_CONTAINER_PORT}
        - VIVO_CONTAINER_VIVO_HOME=${VIVO_CONTAINER_VIVO_HOME}
        - VIVO_HOST_PORT=${VIVO_HOST_PORT}
        - VIVO_HOST_VIVO_HOME=${VIVO_HOST_VIVO_HOME}
        - VIVO_RESET_HOME=${VIVO_RESET_HOME}
        - VIVO_TDB_FILE_MODE=${VIVO_TDB_FILE_MODE}
        - VIVO_VERBOSE=${VIVO_VERBOSE}

    environment:
      - DEFAULT_NAMESPACE=${DEFAULT_NAMESPACE}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_REPLY_TO=${EMAIL_REPLY_TO}
      - EMAIL_SMTP_HOST=${EMAIL_SMTP_HOST}
      - EMAIL_USERNAME=${EMAIL_USERNAME}
      - FORCE_LOCALE=${FORCE_LOCALE}
      - LANGUAGE_FILTER_ENABLED=${LANGUAGE_FILTER_ENABLED}
      - RECONFIGURE=${RECONFIGURE}
      - ROOT_USER_ADDRESS=${ROOT_USER_ADDRESS}
      - SAMPLE_DATA_BRANCH=${SAMPLE_DATA_BRANCH}
      - SAMPLE_DATA_DIRECTORY=${SAMPLE_DATA_DIRECTORY}
      - SAMPLE_DATA_LOAD=${SAMPLE_DATA_LOAD}
      - SAMPLE_DATA_REPO_URL=${SAMPLE_DATA_REPO_URL}
      - SEARCH_ENGINE_PASSWORD=${SEARCH_ENGINE_PASSWORD}
      - SEARCH_ENGINE_URL=${SEARCH_ENGINE_URL}
      - SEARCH_ENGINE_USERNAME=${SEARCH_ENGINE_USERNAME}
      - SELECTABLE_LOCALES=${SELECTABLE_LOCALES}
      - SELF_ID_MATCHING_PROPERTY=${SELF_ID_MATCHING_PROPERTY}
      - SOLR_CONTAINER_PORT=${SOLR_CONTAINER_PORT}
      - SOLR_CORES=${SOLR_CORES}
      - SOLR_HOST_PORT=${SOLR_HOST_PORT}
      - SOLR_RESET_CORE=${SOLR_RESET_CORE}
      - SOLR_URL=${SOLR_URL}
      - SOLR_VERBOSE=${SOLR_VERBOSE}
      - TOMCAT_CONTEXT_PATH=${TOMCAT_CONTEXT_PATH}
      - VIVO_CONTAINER_PORT=${VIVO_CONTAINER_PORT}
      - VIVO_CONTAINER_VIVO_HOME=${VIVO_CONTAINER_VIVO_HOME}
      - VIVO_HOST_PORT=${VIVO_HOST_PORT}
      - VIVO_HOST_VIVO_HOME=${VIVO_HOST_VIVO_HOME}
      - VIVO_RESET_HOME=${VIVO_RESET_HOME}
      - VIVO_TDB_FILE_MODE=${VIVO_TDB_FILE_MODE}
      - VIVO_VERBOSE=${VIVO_VERBOSE}
    ports:
      - ${VIVO_HOST_PORT}:${VIVO_CONTAINER_PORT}
    volumes:
      - ${VIVO_HOST_VIVO_HOME}:${VIVO_CONTAINER_VIVO_HOME}
    networks:
      - vivoweb
    depends_on:
      vivo-solr:
        condition: service_healthy

networks:
  vivoweb:
