name: Docker

on:
  push:
    branches:
      - main
      - 'rel-*-maint'
      - i4018
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest

    env:
      MAVEN_OPTS: -Xmx1024M

    steps:
      - uses: actions/checkout@v2

      - name: Clone Vitro
        shell: bash
        run: |
          # git clone --branch "${GITHUB_REF_NAME}" --single-branch https://github.com/vivo-project/Vitro.git ../Vitro
          git clone --branch "main" --single-branch https://github.com/vivo-project/Vitro.git ../Vitro

      - name: Maven Cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-cache-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-cache-m2-

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 11

      - name: Maven Build
        run: mvn clean install -Dvivo-dir=/usr/local/vivo/home -Dapp-name=vivo -Ddefault-theme=wilma

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine Docker tag
        id: docker_tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            DOCKER_TAG="development"
          elif [[ "${GITHUB_REF_NAME}" == "rel-1.16-maint" ]]; then
            DOCKER_TAG="latest"
          elif [[ "${GITHUB_REF_NAME}" =~ ^rel-([0-9]+\.[0-9]+\.[0-9]+)-maint$ ]]; then
            DOCKER_TAG="vivo-${BASH_REMATCH[1]}"
          elif [[ "${GITHUB_REF_NAME}" =~ ^rel-([0-9]+\.[0-9]+)-maint$ ]]; then
            DOCKER_TAG="vivo-${BASH_REMATCH[1]}.0"
          else
            DOCKER_TAG="$(printf '%s' "${GITHUB_REF_NAME}" | sed -E 's/[^a-zA-Z0-9_.-]/-/g; s/^[.-]+//')"
            DOCKER_TAG="${DOCKER_TAG:0:128}"
            if [[ -z "$DOCKER_TAG" ]]; then
              DOCKER_TAG="sha-${GITHUB_SHA:0:7}"
            fi
          fi
          echo "DOCKER_TAG=$DOCKER_TAG" >> "$GITHUB_ENV"
          echo "Docker tag: $DOCKER_TAG"

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: gaziyucel/vivo:${{ env.DOCKER_TAG }}

      - name: Image digest
        run: echo "${{ steps.docker_build.outputs.digest }}"
